apiVersion: audit.k8s.io/v1
kind: Policy
omitStages: [RequestReceived]
rules:
  # Secrets are Metadata only: never request/response bodies.
  - level: Metadata
    namespaces: [crsl-lab]
    resources:
      - group: ""
        resources: [secrets, pods/exec, pods/attach]
  # Request bodies are needed for pod/Role conditions; real command/env values may be sensitive.
  - level: Request
    namespaces: [crsl-lab]
    verbs: [create, update, patch]
    resources:
      - group: ""
        resources: [pods, pods/ephemeralcontainers]
      - group: rbac.authorization.k8s.io
        resources: [roles]
  - level: Request
    verbs: [create, update, patch]
    resources:
      - group: rbac.authorization.k8s.io
        resources: [clusterroles]
  - level: None
