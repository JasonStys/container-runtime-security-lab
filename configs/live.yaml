json_output: true
rule_matching: all
json_include_output_property: false
time_format_iso_8601: true
buffered_outputs: false
metrics:
  enabled: true
  interval: 1s
  output_rule: false
  output_file: out/live-metrics.jsonl
  kernel_event_counters_enabled: true
  resource_utilization_enabled: false
  state_counters_enabled: false
  libbpf_stats_enabled: false
  plugins_metrics_enabled: false
  include_empty_values: true
log_stderr: true
log_syslog: false
engine:
  kind: modern_ebpf
stdout_output:
  enabled: true
webserver:
  enabled: false
plugins:
  - name: container
    library_path: .tools/libcontainer.so
    init_config: '{"engines":{"docker":{"enabled":true,"sockets":["/var/run/docker.sock"]},"podman":{"enabled":false},"containerd":{"enabled":false},"cri":{"enabled":false},"lxc":{"enabled":false},"libvirt_lxc":{"enabled":false},"bpm":{"enabled":false}}}'
load_plugins: [container]
