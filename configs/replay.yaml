json_output: true
rule_matching: all
json_include_output_property: false
json_include_tags_property: true
time_format_iso_8601: true
buffered_outputs: false
log_stderr: true
log_syslog: false
stdout_output:
  enabled: true
webserver:
  enabled: false
plugins:
  - name: k8saudit
    library_path: .tools/libk8saudit.so
    init_config: '{"useAsync":false,"maxEventSize":65536}'
    open_params: out/audit.jsonl
load_plugins: [k8saudit]
