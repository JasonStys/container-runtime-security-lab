- macro: crsl_scope
  condition: (ka.target.namespace = crsl-lab or (ka.target.resource = clusterroles and ka.target.name startswith crsl-))
- macro: crsl_success
  condition: (ka.stage in (ResponseComplete, ResponseStarted) and (ka.response.code startswith "2" or ka.response.code = "101"))
- macro: crsl_pod_mutation
  condition: (crsl_scope and crsl_success and ka.target.resource = pods and ka.verb in (create, update, patch))
- rule: CRSL Privileged Pod
  desc: Successful pod mutation requested a privileged regular, init or ephemeral container; not proof of execution.
  condition: crsl_pod_mutation and (ka.req.pod.containers.privileged intersects (true) or ka.req.pod.initContainers.privileged intersects (true) or ka.req.pod.ephemeralContainers.privileged intersects (true))
  source: k8s_audit
  output: "CRSL audit=%ka.auditid namespace=%ka.target.namespace object=%ka.target.name"
  priority: Warning
  tags: [crsl, privileged]
- rule: CRSL Host Namespace
  desc: Successful pod mutation requested host PID, IPC or network namespace sharing.
  condition: crsl_pod_mutation and (ka.req.pod.host_pid = true or ka.req.pod.host_ipc = true or ka.req.pod.host_network = true)
  source: k8s_audit
  output: "CRSL audit=%ka.auditid namespace=%ka.target.namespace object=%ka.target.name"
  priority: Warning
  tags: [crsl, host-namespace]
- rule: CRSL HostPath Mount
  desc: Successful pod mutation requested an exact sensitive hostPath from the documented list; not a prefix/escape detector.
  condition: crsl_pod_mutation and ka.req.pod.volumes.hostpath intersects (/, /etc, /proc, /sys, /var/run/docker.sock, /run/containerd/containerd.sock)
  source: k8s_audit
  output: "CRSL audit=%ka.auditid namespace=%ka.target.namespace object=%ka.target.name"
  priority: Warning
  tags: [crsl, hostpath]
- rule: CRSL Pod Exec
  desc: Successful exec/attach API request in the lab namespace; does not establish what command ran.
  condition: crsl_scope and crsl_success and ka.target.resource = pods and ka.target.subresource in (exec, attach) and ka.verb in (create, get)
  source: k8s_audit
  output: "CRSL audit=%ka.auditid namespace=%ka.target.namespace object=%ka.target.name"
  priority: Notice
  tags: [crsl, interactive]
- rule: CRSL Secret Read
  desc: Successful secret get/list/watch in the lab namespace; output contains metadata only, never secret contents.
  condition: crsl_scope and crsl_success and ka.target.resource = secrets and ka.verb in (get, list, watch)
  source: k8s_audit
  output: "CRSL audit=%ka.auditid namespace=%ka.target.namespace object=%ka.target.name"
  priority: Warning
  tags: [crsl, secret-read]
- rule: CRSL Wildcard Role
  desc: Successful Role/ClusterRole mutation requested wildcard resources or verbs; not effective RBAC evaluation.
  condition: crsl_scope and crsl_success and ka.target.resource in (roles, clusterroles) and ka.verb in (create, update, patch) and (ka.req.role.rules.resources intersects ("*") or ka.req.role.rules.verbs intersects ("*"))
  source: k8s_audit
  output: "CRSL audit=%ka.auditid namespace=%ka.target.namespace object=%ka.target.name"
  priority: Warning
  tags: [crsl, wildcard-rbac]
