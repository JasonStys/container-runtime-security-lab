- rule: CRSL Marker Read
  desc: Container read of an explicitly synthetic marker proves runtime capture and rule evaluation, never real credential access.
  condition: evt.type in (open, openat, openat2) and evt.dir = < and evt.failed = false and evt.is_open_read = true and container.id != host and fd.name = /tmp/crsl-sensitive-marker
  source: syscall
  output: "CRSL container=%container.id pid=%proc.pid marker=%fd.name"
  priority: Warning
  tags: [crsl, synthetic-read]
- rule: CRSL Marker Write
  desc: Container write to an explicitly synthetic config marker; not a general filesystem-tampering rule.
  condition: evt.type in (open, openat, openat2) and evt.dir = < and evt.failed = false and evt.is_open_write = true and container.id != host and fd.name = /tmp/crsl-config-marker
  source: syscall
  output: "CRSL container=%container.id pid=%proc.pid marker=%fd.name"
  priority: Warning
  tags: [crsl, synthetic-write]
